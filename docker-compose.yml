# =====================================================
# CaterMatch — LOCAL DEV database (PostgreSQL + PostGIS)
# Free forever · local development only.
# Production runs free on Supabase (Path B) or
# self-hosted Postgres (Path A) — see README §5.
# Usage: docker compose up -d
# =====================================================
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: catmatch-postgres
    environment:
      POSTGRES_USER: catmatch
      POSTGRES_PASSWORD: catmatch
      POSTGRES_DB: catmatch
    ports:
      - "5432:5432"
    volumes:
      - catmatch_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catmatch"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  catmatch_pgdata: